
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GPU HUD Loader + Password (password: ansh)</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#030913;
    --panel-bg:rgba(2,8,12,0.6);
    --accent:#18f7e6;
    --accent-2:#3be7ff;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,#02060b 0%,#061423 100%);font-family:Orbitron,system-ui,monospace;overflow:hidden;color:#9dd;}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;perspective:1200px;}
  canvas{display:block; width:100%; height:100%;}
  /* Overlay UI / Password panel */
  .ui{
    position:fixed; right:18px; top:18px; z-index:60;
    background:var(--panel-bg); padding:12px 14px; border-radius:10px;
    border:1px solid rgba(60,240,220,0.06); box-shadow:0 10px 30px rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
  }
  .ui h3{margin:0 0 8px 0;color:var(--accent); font-size:13px; letter-spacing:0.12em; text-transform:uppercase;}
  .ui input{width:220px;border-radius:6px;border:1px solid rgba(255,255,255,0.06);padding:8px 10px;background:rgba(255,255,255,0.02);color:#dff; outline:none;}
  .ui button{margin-left:8px;padding:8px 12px;border-radius:6px;border:none;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#012; font-weight:700;cursor:pointer;}
  .ui .status{font-size:12px;margin-top:8px;color:#9fd;opacity:0.9;}
  .center-label{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:40;
    color:var(--accent); font-size:18px; letter-spacing:0.18em; pointer-events:none;
    text-transform:uppercase; mix-blend-mode:screen; opacity:0.95;
    text-shadow:0 6px 26px rgba(24,247,230,0.06);
  }

  /* small hint and controls */
  .hint{position:fixed;left:12px;bottom:12px;color:#6fa6a6;font-size:12px;opacity:0.8;z-index:60}
  @media (prefers-reduced-motion: reduce){
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div class="ui" id="uiPanel" aria-live="polite">
  <h3>Unlock HUD</h3>
  <div style="display:flex;align-items:center;">
    <input id="pwd" type="password" placeholder="Enter password" aria-label="password" />
    <button id="btn">Enter</button>
  </div>
  <div class="status" id="status">status: locked</div>
</div>

<div class="center-label" id="centerLabel">SYSTEM HUD</div>
<div class="hint">Click canvas to toggle detach / attach after unlock. Password is "ansh".</div>

<!-- Three.js + postprocessing modules via ES modules -->
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.152.0/build/three.module.js';
import { EffectComposer } from 'https://unpkg.com/three@0.152.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://unpkg.com/three@0.152.0/examples/jsm/postprocessing/RenderPass.js';
import { ShaderPass } from 'https://unpkg.com/three@0.152.0/examples/jsm/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'https://unpkg.com/three@0.152.0/examples/jsm/postprocessing/UnrealBloomPass.js';
import { FXAAShader } from 'https://unpkg.com/three@0.152.0/examples/jsm/shaders/FXAAShader.js';

// Scene setup
const container = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x020613, 0.18);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMappingExposure = 1.0;
container.appendChild(renderer.domElement);

// EffectComposer for bloom + FXAA
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

const bloomParams = { strength: 1.4, threshold: 0.12, radius: 0.9 };
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), bloomParams.strength, bloomParams.radius, bloomParams.threshold);
composer.addPass(bloomPass);

// FXAA pass (for crisp edges)
const fxaaPass = new ShaderPass(FXAAShader);
fxaaPass.uniforms['resolution'].value.set(1 / innerWidth, 1 / innerHeight);
fxaaPass.material.transparent = true;
composer.addPass(fxaaPass);

// Resize
window.addEventListener('resize', onResize);
function onResize(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  fxaaPass.uniforms['resolution'].value.set(1 / innerWidth, 1 / innerHeight);
}

// Add an orthographic HUD group that we'll "detach" by moving toward camera
const hudGroup = new THREE.Group();
scene.add(hudGroup);

// Glow-like additive material
function addMaterial(hex, opacity=1, sizeAtten=false){
  return new THREE.MeshBasicMaterial({
    color: hex,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false,
    side: THREE.DoubleSide
  });
}

// Main geometry: layered torus rings + tick instancing
const ringOuter = new THREE.Mesh(new THREE.TorusGeometry(1.02, 0.016, 12, 160), addMaterial(0x24f0e6, 0.9));
hudGroup.add(ringOuter);
const ringThin = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.006, 8, 160), addMaterial(0x3be7ff, 0.7));
hudGroup.add(ringThin);

// soft translucent ring (for bloom)
const ringGlow = new THREE.Mesh(new THREE.TorusGeometry(1.02, 0.06, 8, 64), addMaterial(0x18f7e6, 0.14));
hudGroup.add(ringGlow);

// radial ticks via InstancedMesh for GPU efficiency
const tickCount = 72;
const tickGeom = new THREE.BoxGeometry(0.012, 0.12, 0.01);
const tickMat = addMaterial(0x24f0e6, 0.95);
const ticks = new THREE.InstancedMesh(tickGeom, tickMat, tickCount);
ticks.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
hudGroup.add(ticks);

// set tick transforms
const tempMat = new THREE.Object3D();
for(let i=0;i<tickCount;i++){
  const angle = (i / tickCount) * Math.PI * 2;
  const radius = 0.92;
  tempMat.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, 0.01);
  tempMat.rotation.z = angle;
  tempMat.scale.set(1, (i%6===0)?1.8:1.0, 1);
  tempMat.updateMatrix();
  ticks.setMatrixAt(i, tempMat.matrix);
}

// orbiting dots as Points (GPU particle-like)
const dotCount = 14;
const dotGeom = new THREE.BufferGeometry();
const positions = new Float32Array(dotCount * 3);
for(let i=0;i<dotCount;i++){
  const a = (i / dotCount) * Math.PI * 2;
  const r = 0.93;
  positions[i*3+0] = Math.cos(a) * r;
  positions[i*3+1] = Math.sin(a) * r;
  positions[i*3+2] = 0.02;
}
dotGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const dotMat = new THREE.PointsMaterial({
  color: 0x9ffeff,
  size: 8.0,
  map: generateCircleTexture('#66fff3'),
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
});
const dots = new THREE.Points(dotGeom, dotMat);
hudGroup.add(dots);

// center disk
const centerMat = new THREE.MeshBasicMaterial({ color: 0x05242b, transparent:true, opacity:0.42, side:THREE.DoubleSide });
const centerDisk = new THREE.Mesh(new THREE.CircleGeometry(0.09, 32), centerMat);
centerDisk.position.z = 0.03;
hudGroup.add(centerDisk);

// animated sweep arc using LineSegments with dashed material approximation
const sweepGeom = new THREE.TorusGeometry(1.135, 0.002, 8, 256);
const sweepMat = new THREE.MeshBasicMaterial({ color: 0x24f0e6, transparent:true, opacity:0.95, blending: THREE.AdditiveBlending, toneMapped:false });
const sweepMesh = new THREE.Mesh(sweepGeom, sweepMat);
sweepMesh.rotation.z = 0.2;
hudGroup.add(sweepMesh);

// subtle depth tilt
hudGroup.rotation.x = 0.06;

// simple helper for generating round particle texture on the fly (canvas)
function generateCircleTexture(hex){
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  // gradient
  const g = ctx.createRadialGradient(size/2, size/2, 1, size/2, size/2, size/2);
  g.addColorStop(0, hex);
  g.addColorStop(0.35, hex + '80');
  g.addColorStop(1, '#00000000');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,size,size);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  tex.generateMipmaps = false;
  return tex;
}

// state: detached or not; unlocked via password
let unlocked = false;
let detached = false;
let detachProgress = 0; // 0..1 used for tween

// simple tween function (linear easing + requestAnimationFrame)
function tweenTo(target, duration = 700, onUpdate=null, onComplete=null){
  const start = performance.now();
  const from = detachProgress;
  const range = target - from;
  function step(now){
    const t = Math.min(1, (now - start)/duration);
    // easeOutCubic
    const eased = 1 - Math.pow(1 - t, 3);
    detachProgress = from + range * eased;
    if(onUpdate) onUpdate(detachProgress);
    if(t < 1) requestAnimationFrame(step);
    else { if(onComplete) onComplete(); }
  }
  requestAnimationFrame(step);
}

// apply detach transform: we move group along z and scale slightly & enable float
function applyDetachProgress(p){
  // p=0 attached (original), p=1 detached (close to camera)
  const zStart = 0;
  const zEnd = 0.82; // move toward camera
  hudGroup.position.z = THREE.MathUtils.lerp(zStart, zEnd, p);
  hudGroup.scale.setScalar(THREE.MathUtils.lerp(1.0, 1.18, p));
  // increase bloom strength with detach
  bloomPass.strength = THREE.MathUtils.lerp(1.2, 2.0, p);
  // increase glow opacity for rings & dots
  ringOuter.material.opacity = THREE.MathUtils.lerp(0.9, 1.1, p);
  ringGlow.material.opacity = THREE.MathUtils.lerp(0.14, 0.26, p);
  dotMat.size = THREE.MathUtils.lerp(8.0, 14.0, p);
}

// minor floating animation applied when detached
let floatTime = 0;

// animation loop
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  floatTime += clock.getDelta();

  // rotate rings
  ringOuter.rotation.z += 0.22 * clock.getDelta();
  ringThin.rotation.z -= 0.16 * clock.getDelta();
  ringGlow.rotation.z += 0.08 * clock.getDelta();
  sweepMesh.rotation.z += 0.44 * clock.getDelta();

  // particle orbit tweak
  const posAttr = dotGeom.attributes.position;
  for(let i=0;i<dotCount;i++){
    const a = (i / dotCount) * Math.PI * 2 + t * (0.12 + (i%2?0.06:0));
    const r = 0.92 + 0.02 * Math.sin(t * 0.7 + i);
    posAttr.array[i*3+0] = Math.cos(a) * r;
    posAttr.array[i*3+1] = Math.sin(a) * r;
  }
  posAttr.needsUpdate = true;

  // floating when detached
  if(detached){
    hudGroup.rotation.y = Math.sin(t * 0.3) * 0.08;
    hudGroup.rotation.x = 0.06 + Math.cos(t * 0.18) * 0.02;
  } else {
    hudGroup.rotation.y = THREE.MathUtils.lerp(hudGroup.rotation.y, 0, 0.06);
    hudGroup.rotation.x = THREE.MathUtils.lerp(hudGroup.rotation.x, 0.06, 0.06);
  }

  // small sweep opacity pulse
  sweepMesh.material.opacity = 0.9 + 0.25 * Math.sin(t * 2.2);

  // apply detach progress transforms
  applyDetachProgress(detachProgress);

  // render via composer for bloom
  composer.render();
}
requestAnimationFrame(animate);

// UI and password logic
const input = document.getElementById('pwd');
const btn = document.getElementById('btn');
const status = document.getElementById('status');
const centerLabel = document.getElementById('centerLabel');

function lockUI(){
  status.textContent = 'status: locked';
  status.style.color = '#9dd';
  input.value = '';
  unlocked = false;
}
function unlockUI(){
  status.textContent = 'status: unlocked';
  status.style.color = '#6ff';
  unlocked = true;
  // auto detach after short delay
  setTimeout(() => { toggleDetach(true); }, 220);
}

btn.addEventListener('click', () => attemptUnlock());
input.addEventListener('keydown', (e) => { if(e.key === 'Enter') attemptUnlock(); });

function attemptUnlock(){
  const v = input.value || '';
  if(v === 'ansh'){
    unlockUI();
    centerLabel.textContent = 'UNLOCKED';
    centerLabel.style.color = '#9ff';
    centerLabel.animate([{opacity:1, transform:'translate(-50%,-50%) scale(1)'},{opacity:0.0, transform:'translate(-50%,-50%) scale(0.9)'}], {duration:900, easing:'ease', iterations:1});
  } else {
    status.textContent = 'status: wrong password';
    status.style.color = '#ff6b6b';
    input.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}], {duration:400});
  }
}

// click canvas toggles attach/detach if unlocked
renderer.domElement.addEventListener('click', () => {
  if(!unlocked) return;
  toggleDetach(!detached);
});

function toggleDetach(force){
  if(force === undefined) force = !detached;
  detached = !!force;
  if(detached){
    // tween detachProgress to 1
    tweenTo(1.0, 800, applyDetachProgress);
  } else {
    tweenTo(0.0, 700, applyDetachProgress);
  }
}

// small accessibility: if user prefers reduced motion, don't auto detach
if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  // don't auto-spin and disable bloom heavy animation
  bloomPass.strength = 0.6;
}

// initial state
lockUI();

/* Notes:
 - The HUD visuals are GPU-accelerated: InstancedMesh for ticks, Points for dots, and UnrealBloomPass for strong neon bloom.
 - To hook real loading progress: call setProgress(n) with 0..100 to display progression in a separate overlay or modify centerLabel text.
 - Password is checked client-side for demo purposes only. Do NOT use client-only password checks for real security.
*/

// (Optional) expose a global progress setter if you want to integrate with loaders
window.setProgress = function(n){
  const pct = Math.max(0, Math.min(100, Math.round(n)));
  centerLabel.textContent = pct >= 100 ? 'READY' : pct + '%';
  if(pct >= 100){
    centerLabel.style.color = '#9ff';
  }
};

</script>
</body>
</html>
