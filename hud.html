<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUD Loader Example</title>
    
    <style>
        /* --- HUD LOADER STYLING --- */
        #hud-loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0d1117; /* Dark futuristic background */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc; /* Glowing cyan/green HUD color */
            transition: opacity 0.5s ease; /* Smooth fade-out */
        }

        /* Radar Scanning Effect */
        .radar-spinner {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 204, 0.2);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .radar-spinner::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: #00ffcc;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Inner Ring */
        .inner-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px dashed #00ffcc;
            animation: spin-reverse 4s linear infinite;
        }

        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        /* Loading Text */
        .hud-text {
            margin-top: 30px;
            font-size: 18px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .hud-percentage {
            margin-top: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        /* Crosshairs (Corner accents) */
        .corner-crosshair {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #00ffcc;
        }
        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; }
    </style>
</head>
<body style="margin: 0; padding: 0; font-family: sans-serif;">

    <!-- --- HUD LOADER HTML --- -->
    <div id="hud-loader-wrapper">
        <div class="corner-crosshair top-left"></div>
        <div class="corner-crosshair top-right"></div>
        <div class="corner-crosshair bottom-left"></div>
        <div class="corner-crosshair bottom-right"></div>

        <div class="radar-spinner">
            <div class="inner-ring"></div>
        </div>
        
        <div class="hud-text">Initializing Systems</div>
        <div class="hud-percentage" id="hud-percent">0%</div>
    </div>

    <!-- --- MAIN WEBSITE CONTENT --- -->
    <div style="padding: 50px; text-align: center;">
        <h1>Welcome to My HUD Website</h1>
        <p>This is your main webpage content that loads behind the HUD animation.</p>
    </div>

    <!-- --- HUD LOADER JAVASCRIPT --- -->
    <script>
        // 1. Percentage counter simulation
        const percentText = document.getElementById('hud-percent');
        let count = 0;
        const interval = setInterval(() => {
            count += Math.floor(Math.random() * 10);
            if (count >= 100) {
                count = 100;
                clearInterval(interval);
            }
            percentText.textContent = count + '%';
        }, 100);

        // 2. Hide loader once the actual page finishes loading
        window.addEventListener('load', () => {
            const loaderWrapper = document.getElementById('hud-loader-wrapper');
            
            // Wait for the percentage to reach 100% before fading out
            setTimeout(() => {
                loaderWrapper.style.opacity = '0';
                
                // Remove from DOM entirely after the fade-out transition completes
                setTimeout(() => {
                    loaderWrapper.style.display = 'none';
                }, 500);
            }, 1000); // 1-second delay so user sees the 100% completion
        });
    </script>
</body>
</html>
